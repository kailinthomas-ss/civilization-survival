<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Civilization Survival Challenge</title><style>body{font-family:Arial;margin:0;background:linear-gradient(135deg,#eef6ff,#fff5df);color:#243142}.wrap{max-width:850px;margin:auto;padding:18px}.top{background:white;padding:15px;border-radius:16px;display:flex;justify-content:space-between;box-shadow:0 5px 18px #0002;position:sticky;top:0}.score{font-weight:bold;background:#fff0bd;padding:8px;border-radius:9px}.bar{height:9px;background:#2878d8;width:0;transition:.3s}.card{background:white;padding:26px;border-radius:20px;margin-top:15px;box-shadow:0 7px 25px #0001}h1,h2{color:#17365d}.civs{display:grid;grid-template-columns:1fr 1fr;gap:14px}.civ{border:3px solid #dce4ee;padding:18px;border-radius:15px;cursor:pointer}.civ:hover,.sel{border-color:#2878d8;background:#eef6ff}.icon{font-size:2.5rem}.choice{display:block;width:100%;text-align:left;padding:13px;margin:7px 0;border:2px solid #dce4ee;border-radius:10px;background:#f8fafc;font-weight:bold;cursor:pointer}.correct{background:#dcfce7!important;border-color:#16a34a!important}.wrong{background:#fee2e2!important;border-color:#dc2626!important}.primary{background:#2878d8;color:white;border:0;padding:12px 17px;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px}.primary:disabled{opacity:.45}.feedback{padding:12px;border-radius:10px;background:#eef2f7;margin-top:10px}.good{background:#dcfce7}.hint{background:#fff7e7;border-left:5px solid #e8a11a;padding:12px;margin:14px 0}.hidden{display:none}.ev{display:block;border:2px solid #dce4ee;padding:10px;border-radius:9px;margin:7px 0}.claim{width:100%;min-height:100px;border:2px solid #dce4ee;border-radius:10px;padding:10px;font-size:1rem}select{padding:8px;border:2px solid #dce4ee;border-radius:8px}@media(max-width:650px){.civs{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><b>🏺 Civilization Survival Challenge</b><span class="score">⭐ <span id="score">0</span>/15</span></div><div class="bar" id="bar"></div><main id="game"></main></div><script>
let s=0,l=0,pred='',final='';const g=document.getElementById('game'),sc=document.getElementById('score'),bar=document.getElementById('bar');function up(){sc.textContent=s;bar.style.width=Math.min(l/6*100,100)+'%'}function go(){l++;up();render();scrollTo(0,0)}function add(n){s+=n;up()}function render(){[start,river,farm,gov,tech,boss,finish][l]()}function start(){g.innerHTML=`<div class=card><h1>🎮 Civilization Survival Challenge</h1><p><b>Mission:</b> Help an early civilization survive and adapt to its environment. Make decisions, earn points, and finish with a historian's claim.</p><div class=hint><b>Time:</b> about 10–20 minutes. Work independently.</div><h2>Level 1 — Choose Your Home 🗺️</h2><p>Which environment would you choose?</p><div class=civs><div class=civ onclick="pick('Egypt',this)"><div class=icon>🇪🇬</div><h2>Egypt</h2><p>Predictable Nile flooding • fertile soil • desert barriers • river transportation</p></div><div class=civ onclick="pick('Mesopotamia',this)"><div class=icon>🏛️</div><h2>Mesopotamia</h2><p>Tigris & Euphrates • fertile land • unpredictable flooding • fewer natural barriers</p></div></div><button id=lock class=primary disabled onclick="add(1);go()">Lock In Prediction →</button><p>Your first answer is only a prediction.</p></div>`}function pick(x,e){pred=x;document.querySelectorAll('.civ').forEach(a=>a.classList.remove('sel'));e.classList.add('sel');lock.disabled=false}
function q(text,arr,pts,cont=true){let id='q'+Math.random().toString(36).slice(2);g.innerHTML+=`<div class="question" id="${id}"><p>${text}</p>`+arr.map((a,i)=>`<button class=choice onclick="ans(this,${a[1]},'${a[2]}',${pts},${cont})">${String.fromCharCode(65+i)}. ${a[0]}</button>`).join('')+`<div class=fb></div></div>`}function ans(b,ok,msg,pts,cont){let box=b.closest('.question');if(box.dataset.done)return;box.dataset.done=1;box.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add(ok?'correct':'wrong');box.querySelector('.fb').innerHTML=`<div class="feedback ${ok?'good':''}"><b>${ok?'✅ Correct! +'+pts:'❌ Not quite.'}</b><br>${msg}</div>`+(cont?`<button class=primary onclick="go()">Continue →</button>`:'');if(ok)add(pts)}
function river(){g.innerHTML=`<div class=card><h2>🌊 Level 2 — Survive the River</h2><div class=hint>Environment can create opportunities and challenges.</div>`;q("🇪🇬 Egypt: What should farmers do with the Nile's predictable cycle?",[["Plan farming around the river cycle",1,"Predictable flooding helped farmers plan planting and harvesting."],["Abandon the river",0,"The Nile was central to farming and transportation."],["Stop farming",0,"The Nile Valley supported agriculture."],["Ignore the flooding",0,"Understanding the cycle helped farmers plan."]],2);g.innerHTML+=`</div>`}
function farm(){g.innerHTML=`<div class=card><h2>🌾 Level 3 — Feed Your People</h2><p>Both civilizations had fertile river valleys, but they responded differently to environmental conditions.</p>`;q("🇪🇬 What was a major agricultural advantage of the Nile?",[["It left fertile soil for crops",1,"Flooding deposited fertile soil that supported farming."],["It eliminated the need for water",0,"Water was essential."],["It forced farmers to move",0,"The valley supported permanent settlements."],["It made farming impossible",0,"The Nile supported farming."]],2,false);q("🏛️ Mesopotamia: What adaptation helped farmers manage water?",[["Irrigation canals",1,"Canals carried river water to farmland."],["Stop using the rivers",0,"The rivers were essential resources."],["Move farms into the desert",0,"Farming depended on water."],["Use no technology",0,"Technology helped solve environmental problems."]],2,true);g.innerHTML+=`</div>`}
function gov(){g.innerHTML=`<div class=card><h2>🏛️ Level 4 — Organize Your Civilization</h2><p>Environmental conditions influenced how people organized society.</p>`;q("🇪🇬 Which system could coordinate farming, taxes, resources, and large projects?",[["A strong central government",1,"Egypt developed centralized government led by the pharaoh."],["No government",0,"Large societies required organization."],["Every village completely independent",0,"Egypt became a unified civilization."],["Each farmer makes laws",0,"Egypt had organized political leadership."]],2);q("🏛️ Why might Mesopotamian city-states compete?",[["For land, water, and power",1,"Valuable resources could lead to competition."],["They had no farmland",0,"Mesopotamia had fertile farmland."],["Rivers were unimportant",0,"Rivers were essential."],["They had one ruler",0,"Mesopotamia developed many city-states."]],2);g.innerHTML+=`</div>`}
function tech(){g.innerHTML=`<div class=card><h2>⚙️ Level 5 — Invent to Adapt</h2><p>Match the need to the technology.</p><p>Move river water to fields: <select id=a><option></option><option>Irrigation canals</option><option>Calendar</option><option>Boats</option><option>Plow</option></select></p><p>Track seasons/Nile cycle: <select id=b><option></option><option>Irrigation canals</option><option>Calendar</option><option>Boats</option><option>Plow</option></select></p><p>Transport goods on rivers: <select id=c><option></option><option>Irrigation canals</option><option>Calendar</option><option>Boats</option><option>Plow</option></select></p><p>Make farming more efficient: <select id=d><option></option><option>Irrigation canals</option><option>Calendar</option><option>Boats</option><option>Plow</option></select></p><button class=primary onclick="checkTech()">Check Matches</button><div id=tf></div></div>`}function checkTech(){if(tf.dataset.done)return;let vals=[a.value,b.value,c.value,d.value],key=['Irrigation canals','Calendar','Boats','Plow'],n=vals.filter((v,i)=>v==key[i]).length;add(n);tf.dataset.done=1;tf.innerHTML=`<div class="feedback ${n==4?'good':''}"><b>${n}/4 correct — +${n} points</b><br>Technology shows how people responded to environmental needs.</div><button class=primary onclick="go()">Final Boss ⚔️</button>`}
function boss(){g.innerHTML=`<div class=card><h2>⚔️ Final Boss — The Historian's Challenge</h2><p>Which civilization adapted better to its environment?</p><div class=civs><div class=civ onclick="fp('Egypt',this)"><div class=icon>🇪🇬</div><h2>Egypt</h2></div><div class=civ onclick="fp('Mesopotamia',this)"><div class=icon>🏛️</div><h2>Mesopotamia</h2></div></div><div id=form class=hidden><h3>Choose TWO evidence pieces.</h3><label class=ev><input type=checkbox> Predictable Nile flooding</label><label class=ev><input type=checkbox> Irrigation canals</label><label class=ev><input type=checkbox> Natural desert barriers</label><label class=ev><input type=checkbox> Centralized government</label><label class=ev><input type=checkbox> Plow and wheel</label><label class=ev><input type=checkbox> City-states/resource competition</label><p><b>Claim:</b> I believe <span id=fc></span> adapted better because...</p><textarea id=claim class=claim placeholder="Explain how your two pieces of evidence support your choice."></textarea><button class=primary onclick="submitClaim()">Submit Historical Claim</button><div id=bf></div></div></div>`}function fp(x,e){final=x;document.querySelectorAll('.civ').forEach(a=>a.classList.remove('sel'));e.classList.add('sel');form.classList.remove('hidden');fc.textContent=x}function submitClaim(){let ev=document.querySelectorAll('#form input:checked'),t=claim.value.trim();if(ev.length!=2){alert('Choose exactly TWO pieces of evidence.');return}if(t.length<25){alert('Write a little more to explain your reasoning.');return}add(5);bf.innerHTML=`<div class="feedback good"><b>🏆 Claim submitted! +5 points</b><br>You used evidence to support a historical conclusion.</div><button class=primary onclick="go()">See Results →</button>`}
function finish(){let badge=s>=13?'📜 Historian Expert':s>=10?'⚙️ Civilization Strategist':s>=7?'🌾 Master Adapter':'🌊 River Survivor';g.innerHTML=`<div class=card><h1>🎉 Challenge Complete!</h1><h2>Final Score: ${s}/15</h2><p><b>${badge}</b></p><p>Your prediction: <b>${pred}</b><br>Your final choice: <b>${final}</b></p><h2>📚 Standards Check</h2><ul><li><b>6.1.CE:</b> Environment influenced farming, resources, and settlement.</li><li><b>6.1.CO:</b> Egypt's centralized government was compared with Mesopotamian city-states.</li><li><b>6.1.CC:</b> Technology and organization helped people adapt.</li></ul><div class=hint><b>Big Idea:</b> Environment created opportunities and challenges; people responded through organization and technology.</div><button class=primary onclick=location.reload()>🔄 Play Again</button><button onclick=print()>🖨️ Print Results</button></div>`;bar.style.width='100%'}render();</script></body></html>
